name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2.0'

    - name: Install Tools
      run: brew install xcodegen imagemagick zsign

    - name: Generate App Icon Assets
      run: |
        mkdir -p Media.xcassets/AppIcon.appiconset
        
        if [ -f "icon.svg" ]; then
          magick -background none icon.svg -resize 1024x1024 Media.xcassets/AppIcon.appiconset/icon_1024.png
        else
          magick -size 1024x1024 xc:blue Media.xcassets/AppIcon.appiconset/icon_1024.png
        fi
        
        cat << 'EOF' > Media.xcassets/AppIcon.appiconset/Contents.json
        {
          "images": [
            {
              "filename": "icon_1024.png",
              "idiom": "universal",
              "platform": "ios",
              "size": "1024x1024"
            }
          ],
          "info": {
            "author": "xcode",
            "version": 1
          }
        }
        EOF

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Build App
      run: |
        xcodebuild -project MyBrowser.xcodeproj \
          -scheme MyBrowser \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Create Proper IPA with zsign
      run: |
        APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
        zsign -z 9 -o build/MyBrowser.ipa "$APP_PATH"

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MyBrowser-IPA
        path: build/MyBrowser.ipa