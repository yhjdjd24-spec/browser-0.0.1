name: MyBrowser
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: 15.0
  xcodeVersion: "16.2.0"
  objectVersion: 56
targets:
  MyBrowser:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - "*.swift"
      - path: Media.xcassets
    settings:
      GENERATE_INFOPLIST_FILE: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Приложению нужен доступ к галерее для загрузки фото на сайты."
      INFOPLIST_KEY_NSCameraUsageDescription: "Приложению нужен доступ к камере для съёмки и загрузки фото/видео."
      INFOPLIST_KEY_UIFileSharingEnabled: YES
      INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES