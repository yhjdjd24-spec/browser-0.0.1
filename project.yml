name: MyBrowser
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: 15.0
  xcodeVersion: "15.4"
  objectVersion: 56
targets:
  MyBrowser:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - "*.swift"
    settings:
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES